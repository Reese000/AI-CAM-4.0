function_name: "gcode_to_segments"
signature: >
  def gcode_to_segments(commands: List[Tuple[str, Dict[str, float]]]) -> List[Tuple[Tuple[float, float, float], Tuple[float, float, float], str]]
description: "Convert parsed G-code commands to toolpath line segments"
notes: >
  ([('G0', {'X': 0.0, 'Y': 0.0, 'Z': 0.0}), ('G1', {'X': 10.0, 'Y': 0.0, 'Z': 0.0})]) -> [((0.0, 0.0, 0.0), (10.0, 0.0, 0.0), 'linear')]
