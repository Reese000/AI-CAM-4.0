function_name: "face_milling_paths"
signature: >
  def face_milling_paths(stock, tool) -> list[tuple[tuple[float, float, float], tuple[float, float, float]]]
description: >
  Generate face milling toolpath for flat surfaces with given stock and tool parameters
notes: >
  (({"bbox": ((0,0,0), (100,100,10))}, {"diameter": 10.0})) -> [((0,0,10), (100,0,10)), ((100,10,10), (0,10,10))] (simplified zigzag)
  (({"bbox": ((0,0,0), (50,50,5))}, {"diameter": 25.0})) -> [((0,0,5), (50,0,5)), ((50,25,5), (0,25,5))] (simplified zigzag)
