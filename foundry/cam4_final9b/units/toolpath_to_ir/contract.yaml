function_name: "toolpath_to_ir"
signature: "def toolpath_to_ir(toolpath: list[dict]) -> list[dict]"
description: "Convert toolpath segments to intermediate representation for post-processing"
notes: >
  [{'type': 'linear', 'points': [(0,0,0),(10,0,0)]}] -> [{'cmd': 'G1', 'x': 10.0, 'y': 0.0, 'z': 0.0}]
  [{'type': 'arc', 'center': (5,0,0), 'start': (0,0,0), 'end': (10,0,0)}] -> [{'cmd': 'G2', 'x': 10.0, 'y': 0.0, 'i': 5.0, 'j': 0.0}]
