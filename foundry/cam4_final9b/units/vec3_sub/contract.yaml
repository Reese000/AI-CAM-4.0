function_name: "vec3_sub"
signature: >
  def vec3_sub(a: tuple[float, float, float], b: tuple[float, float, float]) -> tuple[float, float, float]
description: "Subtract two 3D vectors component-wise"
notes: >
  (4.0, 5.0, 6.0) - (1.0, 2.0, 3.0) -> (3.0, 3.0, 3.0)
  (0.0, 0.0, 0.0) - (-1.5, 2.5, 0.0) -> (1.5, -2.5, 0.0)
