function_name: "simulate_toolpath"
signature: "def simulate_toolpath(stock, toolpath) -> list[list[list[float]]]"
description: >
  Simulate material removal along toolpath, returning heightmap frames for animation.
  stock must be list[list[float]] (2D heightmap from stock_heightmap).
  The function wraps it internally as needed.
notes: >
  ([[20.0]*10]*10, [((0,0,10), (100,0,10))]) -> [[[10.0]*10]*10] (first frame)
  ([[5.0]*5]*5, [((0,0,3), (50,0,3))]) -> [[[3.0]*5]*5] (first frame)
