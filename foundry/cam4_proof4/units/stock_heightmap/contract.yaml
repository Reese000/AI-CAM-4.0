function_name: "stock_heightmap"
signature: "def stock_heightmap(stock_dims, resolution) -> list[list[float]]"
description: "Create Z-map heightfield representation of stock material at given resolution"
notes: >
  (([100.0, 100.0, 20.0], 10)) -> [[20.0]*10]*10 (10x10 grid all at height 20.0)
  (([50.0, 50.0, 5.0], 5)) -> [[5.0]*5]*5 (5x5 grid all at height 5.0)
