function_name: "face_milling_paths"
signature: "def face_milling_paths(stock: dict, tool: dict) -> list[dict]"
description: "Generate face milling toolpath for stock surface machining"
notes: >
  stock={'bbox': ((0,0,0),(100,100,10)), 'resolution': 0.5}, tool={'diameter': 10.0} -> [{'type': 'linear', 'points': [(0,0,5),(100,0,5)]}]
  stock={'bbox': ((0,0,0),(50,50,5))}, tool={'diameter': 5.0} -> [{'type': 'linear', 'points': [(0,0,2.5),(50,0,2.5)]}]
