function_name: "render_fanuc"
signature: "def render_fanuc(ir_segments) -> str"
description: "Render intermediate representation to Fanuc G-code with proper formatting"
notes: >
  ([{"type": "move", "from": (0,0,5), "to": (10,0,0), "feed": 100.0}]) -> "G0 X0.000 Y0.000 Z5.000\nG1 X10.000 Y0.000 Z0.000 F100.000"
  ([{"type": "move", "from": (0,0,5), "to": (10,0,0), "feed": 100.0}, {"type": "move", "from": (10,0,0), "to": (10,10,0), "feed": 100.0}]) -> "G0 X0.000 Y0.000 Z5.000\nG1 X10.000 Y0.000 Z0.000 F100.000\nG1 X10.000 Y10.000 Z0.000 F100.000"
