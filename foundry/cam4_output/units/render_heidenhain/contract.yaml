function_name: "render_heidenhain"
signature: "def render_heidenhain(ir_segments: list[dict]) -> str"
description: "Render IR moves as Heidenhain G-code text"
notes: >
  [{'type': 'linear', 'from': (0,0,0), 'to': (10,10,0)}] -> 'L X0.000 Y0.000 Z0.000\nL X10.000 Y10.000 Z0.000'
  [{'type': 'linear', 'from': (0,0,5), 'to': (5,0,5)}] -> 'L X0.000 Y0.000 Z5.000\nL X5.000 Y0.000 Z5.000'
