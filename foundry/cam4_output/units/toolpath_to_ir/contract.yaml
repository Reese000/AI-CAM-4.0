function_name: "toolpath_to_ir"
signature: >
  def toolpath_to_ir(toolpath: list[tuple[tuple[float,float,float], tuple[float,float,float]]]) -> list[dict]
description: "Convert toolpath segments to intermediate representation (ordered moves)"
notes: >
  [((0,0,0), (10,10,0))] -> [{'type': 'linear', 'from': (0,0,0), 'to': (10,10,0)}]
  [((0,0,0), (5,0,0)), ((5,0,0), (10,0,0))] -> [{'type': 'linear', ...}, {'type': 'linear', ...}]
