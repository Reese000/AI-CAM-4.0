function_name: "parse_gcode"
signature: "def parse_gcode(text: str) -> list[dict[str, any]]"
description: "Parse G-code text into structured command list"
notes: >
  'G0 X0 Y0 Z0\nG1 X10 Y10' -> [{'cmd': 'G0', 'X': 0.0, 'Y': 0.0, 'Z': 0.0}, {'cmd': 'G1', 'X': 10.0, 'Y': 10.0}]
  'M3 S1000' -> [{'cmd': 'M3', 'S': 1000}]
