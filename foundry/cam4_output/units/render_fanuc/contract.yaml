function_name: "render_fanuc"
signature: "def render_fanuc(ir_segments: list[dict]) -> str"
description: "Render IR moves as Fanuc G-code text"
notes: >
  [{'type': 'linear', 'from': (0,0,0), 'to': (10,10,0)}] -> 'G0 X0.000 Y0.000 Z0.000\nG1 X10.000 Y10.000 Z0.000'
  [{'type': 'linear', 'from': (0,0,5), 'to': (5,0,5)}] -> 'G0 X0.000 Y0.000 Z5.000\nG1 X5.000 Y0.000 Z5.000'
