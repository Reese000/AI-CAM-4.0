function_name: "gcode_to_segments"
signature: >
  def gcode_to_segments(commands: list[dict[str, any]]) -> list[tuple[tuple[float,float,float], tuple[float,float,float]]]
description: "Convert G-code commands to linear move segments"
notes: >
  [{'cmd': 'G0', 'X': 0, 'Y': 0, 'Z': 0}, {'cmd': 'G1', 'X': 10, 'Y': 10}] -> [((0,0,0), (10,10,0))]
  [{'cmd': 'G0', 'X': 0}, {'cmd': 'G1', 'X': 5}, {'cmd': 'G1', 'X': 10}] -> [((0,0,0), (5,0,0)), ((5,0,0), (10,0,0))]
