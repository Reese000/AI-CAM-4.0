function_name: vec3_sub
signature: "def vec3_sub(a: tuple[float, float, float], b: tuple[float, float, float]) -> tuple[float, float, float]"
description: >
  Subtract vector b from vector a component-wise.
notes: >
  ((10, 20, 30), (1, 2, 3)) -> (9, 18, 27)
  ((0, 0, 0), (1, 1, 1)) -> (-1, -1, -1)
  ((5, 5, 5), (5, 5, 5)) -> (0, 0, 0)
