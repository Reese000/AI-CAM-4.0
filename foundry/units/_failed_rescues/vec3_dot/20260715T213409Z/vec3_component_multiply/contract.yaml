function_name: vec3_component_multiply
signature: 'def vec3_component_multiply(a: tuple[float, float, float], b: tuple[float,
  float, float]) -> tuple[float, float, float]'
description: Multiply corresponding components of two 3D vectors and return the resulting
  vector.
notes: '((1, 2, 3), (4, 5, 6)) -> (4, 10, 18)

  ((0, 0, 0), (7, 8, 9)) -> (0, 0, 0)

  ((1.5, 2.5, 3.5), (2.0, 4.0, 6.0)) -> (3.0, 10.0, 21.0)'
