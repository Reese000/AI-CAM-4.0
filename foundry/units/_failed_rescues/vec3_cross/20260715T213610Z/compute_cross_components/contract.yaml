function_name: compute_cross_components
signature: 'def compute_cross_components(a: tuple[float, float, float], b: tuple[float,
  float, float]) -> tuple[float, float, float]'
description: Compute the cross product of two 3D vectors using component-wise formulas.
notes: 'Input: ((1, 0, 0), (0, 1, 0)) -> Output: (0, 0, 1)  Input: ((0, 1, 0), (0,
  0, 1)) -> Output: (1, 0, 0)  Input: ((1, 2, 3), (4, 5, 6)) -> Output: (-3, 6, -3)'
