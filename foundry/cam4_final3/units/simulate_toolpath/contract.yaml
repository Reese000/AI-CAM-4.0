function_name: "simulate_toolpath"
signature: >
  def simulate_toolpath(stock: list[list[float]], toolpath: list[dict[str, any]]) -> list[list[list[float]]]
description: "Simulate material removal and return animation frames"
notes: >
  ([[5.0]*10 for _ in range(10)], [{'type': 'line', 'start': (0,0,0), 'end': (10,0,0)}]) -> [[[5.0]*10 for _ in range(10)], [[0.0]+[5.0]*9 for _ in range(10)]]
  ([[5.0]*10 for _ in range(10)], [{'type': 'line', 'start': (0,0,0), 'end': (5,0,0)}]) -> [[[5.0]*10 for _ in range(10)], [[0.0]*5+[5.0]*5 for _ in range(10)]]
