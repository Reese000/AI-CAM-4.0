function_name: "adaptive_clearing_paths"
signature: "def adaptive_clearing_paths(stock: dict, tool: dict) -> list[dict[str, any]]"
description: "Generate adaptive clearing toolpath"
notes: >
  ({'dims': (10,10,5), 'resolution': 0.5}, {'diameter': 5, 'length': 20}) -> [{'type': 'line', 'start': (0,0,-1), 'end': (10,0,-1)}, {'type': 'arc', 'start': (10,0,-1), 'end': (10,5,-1), 'center': (7.5,2.5,-1)}]
