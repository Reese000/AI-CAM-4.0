function_name: "vec3_normalize"
signature: "def vec3_normalize(v: tuple[float, float, float]) -> tuple[float, float, float]"
description: "Return unit vector in same direction as input"
notes: >
  (3, 0, 0) -> (1.0, 0.0, 0.0)
  (2, 3, 4) -> (0.3713906763541037, 0.5570860145311556, 0.7427813527082074)
