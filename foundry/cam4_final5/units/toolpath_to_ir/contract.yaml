function_name: "toolpath_to_ir"
signature: "def toolpath_to_ir(toolpath: list[tuple[float, float, float]]) -> list[dict]"
description: "Convert toolpath points to intermediate representation with move types"
notes: >
  [(0.0, 0.0, 5.0), (10.0, 0.0, 5.0), (10.0, 10.0, 0.0)] -> [{'type': 'rapid', 'start': (0.0, 0.0, 5.0), 'end': (0.0, 0.0, 5.0)}, {'type': 'feed', 'start': (0.0, 0.0, 5.0), 'end': (10.0, 0.0, 5.0)}, {'type': 'feed', 'start': (10.0, 0.0, 5.0), 'end': (10.0, 10.0, 0.0)}]
  [(0.0, 0.0, 0.0)] -> [{'type': 'rapid', 'start': (0.0, 0.0, 0.0), 'end': (0.0, 0.0, 0.0)}]
