function_name: "bbox_contains"
signature: >
  def bbox_contains(bbox: tuple[tuple[float, float, float], tuple[float, float, float]], point: tuple[float, float, float]) -> bool
description: "Test if point is inside bounding box (inclusive)"
notes: >
  bbox = ((0,0,0), (1,1,1)), point = (0.5, 0.5, 0.5) -> True
  bbox = ((0,0,0), (1,1,1)), point = (2, 0.5, 0.5) -> False
