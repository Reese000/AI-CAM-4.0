function_name: "stock_heightmap"
signature: >
  def stock_heightmap(stock_dims: tuple[float, float, float], resolution: float) -> dict
description: "Create Z-map heightfield stock model for simulation"
notes: >
  (100.0, 100.0, 10.0), 1.0 -> {'width': 100, 'height': 100, 'zmap': [[10.0]*100]*100}
  (50.0, 50.0, 5.0), 0.5 -> {'width': 100, 'height': 100, 'zmap': [[5.0]*100]*100}
