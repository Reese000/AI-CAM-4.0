function_name: "gcode_to_segments"
signature: >
  def gcode_to_segments(commands: List[Dict]) -> List[Tuple[np.ndarray, np.ndarray]]
description: "Convert G-code commands to a list of toolpath segments with positions."
notes: >
  [{'command': 'G0', 'X': 0, 'Y': 0}, {'command': 'G0', 'X': 1, 'Y': 1}] -> [([0,0,0], [1,1,0])]
