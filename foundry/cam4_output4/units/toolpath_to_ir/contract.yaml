function_name: "toolpath_to_ir"
signature: "def toolpath_to_ir(toolpath: List[Tuple[np.ndarray, np.ndarray]]) -> List[Dict]"
description: "Convert toolpath segments to an intermediate representation for post-processing."
notes: >
