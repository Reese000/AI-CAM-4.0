function_name: "gcode_to_segments"
signature: >
  def gcode_to_segments(commands: list[dict]) -> list[tuple[tuple[float, float, float], tuple[float, float, float]]]
description: "Convert parsed G-code commands into toolpath segments (start and end points)"
notes: >
  [{'type': 'G0', 'X': 0.0, 'Y': 0.0}, {'type': 'G1', 'X': 10.0, 'Y': 10.0}] -> [((0.0,0.0,0.0), (10.0,10.0,0.0))]
